name: Sync TorrServer add-on icon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - icon.png

permissions:
  contents: write

jobs:
  sync-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download TorrServer icon
        run: |
          curl -fL https://raw.githubusercontent.com/YouROK/TorrServer/master/web/public/icon.png -o icon.png

      - name: Commit icon if changed
        run: |
          if git diff --quiet -- icon.png && git ls-files --error-unmatch icon.png >/dev/null 2>&1; then
            echo "Icon is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon.png
          git commit -m "Add TorrServer add-on icon"
          git push
