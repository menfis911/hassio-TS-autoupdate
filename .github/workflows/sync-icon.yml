name: Build TorrServer add-on icon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - torrserver/icon.svg

permissions:
  contents: write

jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image renderer
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Render PNG icon
        run: |
          set -euo pipefail
          mkdir -p torrserver
          convert -background none torrserver/icon.svg -resize 128x128 torrserver/icon.png
          file torrserver/icon.png

      - name: Commit icon if changed
        run: |
          set -euo pipefail

          if git diff --quiet -- torrserver/icon.png && git ls-files --error-unmatch torrserver/icon.png >/dev/null 2>&1; then
            echo "Icon is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torrserver/icon.png
          git commit -m "Build custom add-on icon"
          git push
